name: nightly

on:
  schedule:
    # After NHTSA's usual morning publish (UTC).
    - cron: "30 12 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull-score-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU scoring deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers==5.16.1 sentencepiece pandas pyarrow protobuf

      - name: Fetch live DeBERTa weights
        run: python -m prod.nightly fetch-weights
        env:
          PYTHONPATH: .
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Pull new filings, score, mix-check
        run: python -m prod.nightly run
        env:
          PYTHONPATH: .

      - name: Publish nightly summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/prod/nightly.json data/nightly/nhtsa_month_counts.json data/nightly/seen_after_cutoff.txt
          if git diff --cached --quiet; then
            echo "No nightly file changes"
            exit 0
          fi
          git commit -m "Nightly NHTSA pull [skip ci]"
          git push
